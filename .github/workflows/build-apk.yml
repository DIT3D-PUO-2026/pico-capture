name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.package.outputs.version }}
      signed: ${{ steps.package.outputs.signed }}
      publish: ${{ steps.plan.outputs.publish }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check release routing and changelog selection
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Read changelog and release request
        id: plan
        run: python3 .github/scripts/prepare_release.py

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-provider: basic

      - name: Install Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Restore project signing key for trusted builds
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.PICO_CAPTURE_KEYSTORE_BASE64 }}
          PUBLISH_RELEASE: ${{ steps.plan.outputs.publish }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            mkdir -p signing
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > signing/debug.keystore
            chmod 600 signing/debug.keystore
          elif [[ "$PUBLISH_RELEASE" == true ]]; then
            echo '::error::Add the PICO_CAPTURE_KEYSTORE_BASE64 repository secret before publishing a release.'
            exit 1
          else
            echo 'No project signing secret: this build provides a temporary-key debug APK and an unsigned release APK.'
          fi

      - name: Lint and build debug and release APKs
        run: bash ./gradlew :app:lintDebug :app:assembleDebug :app:assembleRelease --no-daemon --console=plain

      - name: Package versioned APKs and checksums
        id: package
        run: python3 .github/scripts/package_apks.py

      - name: Verify signed release APK
        if: steps.package.outputs.signed == 'true'
        env:
          APP_VERSION: ${{ steps.package.outputs.version }}
        run: '"$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "dist/PicoCapture-$APP_VERSION.apk"'

      - name: Upload APK downloads
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: PicoCapture-${{ steps.package.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    needs: build
    if: needs.build.outputs.publish == 'true' && needs.build.outputs.signed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out release tools
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download the verified build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: PicoCapture-${{ needs.build.outputs.version }}
          path: dist

      - name: Publish beta release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APP_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          python3 .github/scripts/publish_release.py
